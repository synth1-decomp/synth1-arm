name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Run pre-build tests / validations
  test:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    name: Test ${{ matrix.arch }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Run unit tests
        run: scripts/run_unit_tests.sh --arch ${{ matrix.arch }}

  # Build Synth1 and zip it up
  build:
    needs: test
    strategy:
      matrix:
        format: [au, vst3]
        config: [Debug, Release]
        include:
          - format: au
            label: AU
            bundle: Synth1.component
          - format: vst3
            label: VST3
            bundle: Synth1.vst3
    name: Build ${{ matrix.label }} ${{ matrix.config }}
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      ZIP: build/artifacts/Synth1-${{ matrix.label }}-${{ matrix.config }}.zip
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/build_plugin.sh --format ${{ matrix.format }} ${{ matrix.config }}
      - name: Package
        run: |
          mkdir -p "$(dirname "$ZIP")"
          ditto -c -k --keepParent build/modern/Build/Products/${{ matrix.config }}/${{ matrix.bundle }} "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.format }}-${{ matrix.config }}
          path: ${{ env.ZIP }}
          retention-days: 1

  # Run post-build tests / validations
  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        format: [au, vst3]
        config: [Debug, Release]
        arch: [arm64, x86_64]
        include:
          - format: au
            label: AU
            bundle: Synth1.component
          - format: vst3
            label: VST3
            bundle: Synth1.vst3
    name: Validate ${{ matrix.label }} ${{ matrix.config }} ${{ matrix.arch }}
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      ZIP: build/artifacts/Synth1-${{ matrix.label }}-${{ matrix.config }}.zip
      PLUGIN: build/modern/Build/Products/${{ matrix.config }}/${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.format }}-${{ matrix.config }}
          path: build/artifacts
      - name: Unpack
        run: |
          mkdir -p "$(dirname "$PLUGIN")"
          ditto -x -k "$ZIP" "$(dirname "$PLUGIN")"
      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Check the plugin
        run: scripts/check_plugin.sh --format ${{ matrix.format }} "$PLUGIN"
      - name: Run the integration tests
        run: scripts/run_integration_tests.sh --format ${{ matrix.format }} --arch ${{ matrix.arch }} --${{ matrix.format }} "$PLUGIN"
      - name: Run the validator
        run: scripts/run_validator_tests.sh --format ${{ matrix.format }} --arch ${{ matrix.arch }} --${{ matrix.format }} "$PLUGIN"

  # Build installers and publish them to a GitHub release tagged '<version>-<commit>'
  release:
    if: github.event_name == 'push'
    needs: validate
    name: Release
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: build/artifacts
      - name: Unpack
        run: |
          for config in Debug Release; do
            mkdir -p build/modern/Build/Products/$config
            for label in AU VST3; do
              ditto -x -k build/artifacts/Synth1-$label-$config.zip build/modern/Build/Products/$config
            done
          done
      - name: Read the version
        run: |
          root=$PWD
          source scripts/version.sh
          if [ "$(build_id)" = dev ]; then
            echo "error: the checkout has uncommitted changes, so there's no commit ID to release"
            exit 1
          fi
          echo "VERSION=$(marketing_version)-$(build_id)" >> "$GITHUB_ENV"
      - name: Check this version isn't released yet
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION is already released"
            echo "RELEASED=1" >> "$GITHUB_ENV"
          fi
      - name: Build the installers
        if: env.RELEASED != '1'
        run: |
          for format in au vst3; do
            for config in Release Debug; do
              scripts/build_pkg.sh --format $format --config $config
            done
          done
      - name: Publish the release
        if: env.RELEASED != '1'
        run: |
          gh release create "$VERSION" \
            "build/pkg/Synth1-AU-$VERSION-release.pkg" \
            "build/pkg/Synth1-AU-$VERSION-debug.pkg" \
            "build/pkg/Synth1-VST3-$VERSION-release.pkg" \
            "build/pkg/Synth1-VST3-$VERSION-debug.pkg" \
            --target "$GITHUB_SHA" \
            --title "Synth1 $VERSION" \
            --generate-notes
