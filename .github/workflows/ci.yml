name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Run pre-build tests / validations
  test:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    name: Test ${{ matrix.arch }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Run unit tests
        run: scripts/run_unit_tests.sh --arch ${{ matrix.arch }}

  # Build Synth1 and zip it up
  build:
    needs: test
    strategy:
      matrix:
        config: [Debug, Release]
    name: Build ${{ matrix.config }}
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      ZIP: build/artifacts/Synth1-${{ matrix.config }}.zip
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/build_component.sh ${{ matrix.config }}
      - name: Package
        run: |
          mkdir -p "$(dirname "$ZIP")"
          ditto -c -k --keepParent build/modern/Build/Products/${{ matrix.config }}/Synth1.component "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.config }}
          path: ${{ env.ZIP }}
          retention-days: 1

  # Run post-build tests / validations
  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        arch: [arm64, x86_64]
    name: Validate ${{ matrix.config }} ${{ matrix.arch }}
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      ZIP: build/artifacts/Synth1-${{ matrix.config }}.zip
      COMPONENT: build/modern/Build/Products/${{ matrix.config }}/Synth1.component
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.config }}
          path: build/artifacts
      - name: Unpack
        run: |
          mkdir -p "$(dirname "$COMPONENT")"
          ditto -x -k "$ZIP" "$(dirname "$COMPONENT")"
      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Check the component
        run: scripts/check_component.sh "$COMPONENT"
      - name: Run AU tests
        run: scripts/run_au_tests.sh --arch ${{ matrix.arch }} --component "$COMPONENT"
      - name: Run auval tests
        run: scripts/run_auval_tests.sh --arch ${{ matrix.arch }} --component "$COMPONENT"

  # Build installers and publish them to a GitHub release tagged '<version>-<commit>'
  release:
    if: github.event_name == 'push'
    needs: validate
    name: Release
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: build/artifacts
      - name: Unpack
        run: |
          for config in Debug Release; do
            mkdir -p build/modern/Build/Products/$config
            ditto -x -k build/artifacts/Synth1-$config.zip build/modern/Build/Products/$config
          done
      - name: Read the version
        run: |
          root=$PWD
          source scripts/version.sh
          if [ "$(build_id)" = dev ]; then
            echo "error: the checkout has uncommitted changes, so there's no commit ID to release"
            exit 1
          fi
          echo "VERSION=$(marketing_version)-$(build_id)" >> "$GITHUB_ENV"
      - name: Check this version isn't released yet
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION is already released"
            echo "RELEASED=1" >> "$GITHUB_ENV"
          fi
      - name: Build the installers
        if: env.RELEASED != '1'
        run: |
          scripts/build_pkg.sh --config Release
          scripts/build_pkg.sh --config Debug
      - name: Publish the release
        if: env.RELEASED != '1'
        run: |
          gh release create "$VERSION" \
            "build/pkg/Synth1-$VERSION-release.pkg" \
            "build/pkg/Synth1-$VERSION-debug.pkg" \
            --target "$GITHUB_SHA" \
            --title "Synth1 $VERSION" \
            --generate-notes
